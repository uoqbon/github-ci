# =============================================================================
# Self-Healing CI Orchestrator  (lives in the CONSUMER repo, or org `.github`)
# -----------------------------------------------------------------------------
# Triggered AFTER the CI workflow finishes (workflow_run), decoupled from the
# untrusted PR. Flow:
#   failure -> fetch logs -> classify -> (transient: retry once)
#           -> (code/config: AI analysis -> open issue -> assign Copilot agent)
# The agent opens a DRAFT PR; merge stays gated by the required-workflow ruleset.
#
# SECURITY: runs from the default branch with elevated scopes; never checks out
# untrusted head code with this token. COST: the classify gate prevents waking
# the agent (Actions minutes + AI tokens = double meter) on transient blips.
# =============================================================================
name: self-healing-ci

on:
  workflow_run:
    workflows: ["CI"]        # name of the consumer's caller workflow
    types: [completed]

permissions:
  contents: read
  actions: read              # read logs/jobs of the triggering run
  issues: write              # file the self-heal issue

concurrency:
  group: self-heal-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  triage-and-remediate:
    # Only on failure; loop-guard against self-healing a remediation branch.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure'
          && !startsWith(github.event.workflow_run.head_branch, 'copilot/')
          && !startsWith(github.event.workflow_run.head_branch, 'ci-self-heal/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # User-scoped token (PAT or GitHub App user-to-server) — REQUIRED to assign Copilot.
      GH_TOKEN: ${{ secrets.SELF_HEAL_TOKEN }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      REPO: ${{ github.repository }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Fetch failing jobs + logs
        run: |
          gh api "/repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.conclusion=="failure")
                  | {name, steps: [.steps[] | select(.conclusion=="failure") | .name]}' > failed.json
          gh api "/repos/$REPO/actions/runs/$RUN_ID/logs" > logs.zip || true
          unzip -o logs.zip -d logs >/dev/null 2>&1 || true
          cat failed.json

      - name: Classify failure (COST GATE — do not wake the agent for transient infra)
        id: classify
        run: |
          PATTERN='ETIMEDOUT|ECONNRESET|rate limit|HTTP 429|i/o timeout|runner.*(lost|terminated)|503 Service'
          if grep -rEiq "$PATTERN" logs/ 2>/dev/null; then
            echo "class=transient" >> "$GITHUB_OUTPUT"
          else
            echo "class=code" >> "$GITHUB_OUTPUT"
          fi

      - name: Transient — re-run failed jobs once, then stop (no AI/agent spend)
        if: steps.classify.outputs.class == 'transient'
        run: gh run rerun "$RUN_ID" --failed

      - name: AI root-cause analysis (code/config only)
        if: steps.classify.outputs.class == 'code'
        run: |
          # Send only the FAILING EXCERPT (token economy) to your model of choice
          # (GitHub Models API / Azure OpenAI / etc.) and emit analysis.md.
          EXCERPT="$(find logs -type f -name '*.txt' -exec tail -c 4000 {} + 2>/dev/null | head -c 8000)"
          {
            echo "## Automated CI failure analysis"
            echo ""
            echo "Failed run: \`$RUN_ID\` on branch \`$HEAD_BRANCH\`."
            echo ""
            echo "### Failing log excerpt"
            echo '```'
            echo "$EXCERPT"
            echo '```'
            echo ""
            echo "> @copilot please investigate the root cause and open a fix PR."
          } > analysis.md

      - name: Open self-heal issue
        if: steps.classify.outputs.class == 'code'
        id: issue
        run: |
          URL=$(gh issue create --repo "$REPO" \
            --title "[self-heal] CI failure on $HEAD_BRANCH" \
            --label ci-self-heal \
            --body-file analysis.md)
          echo "number=${URL##*/}" >> "$GITHUB_OUTPUT"

      - name: Assign the issue to the Copilot coding agent (GraphQL)
        if: steps.classify.outputs.class == 'code'
        run: |
          OWNER="${REPO%/*}"; NAME="${REPO#*/}"
          # (a) Find the copilot-swe-agent bot node ID (also confirms the agent is enabled).
          BOT_ID=$(gh api graphql \
            -H "GraphQL-Features: issues_copilot_assignment_api_support,coding_agent_model_selection" \
            -f query='query($o:String!,$n:String!){repository(owner:$o,name:$n){suggestedActors(capabilities:[CAN_BE_ASSIGNED],first:5){nodes{login __typename ... on Bot{id}}}}}' \
            -F o="$OWNER" -F n="$NAME" \
            --jq '.data.repository.suggestedActors.nodes[] | select(.login=="copilot-swe-agent") | .id')
          if [ -z "$BOT_ID" ]; then
            echo "::warning::Copilot coding agent not enabled for this repo — leaving issue for humans."
            exit 0
          fi
          # (b) Resolve the issue node ID.
          ISSUE_ID=$(gh api graphql \
            -f query='query($o:String!,$n:String!,$num:Int!){repository(owner:$o,name:$n){issue(number:$num){id}}}' \
            -F o="$OWNER" -F n="$NAME" -F num=${{ steps.issue.outputs.number }} \
            --jq '.data.repository.issue.id')
          # (c) Assign Copilot -> agent runs in an ephemeral runner and opens a DRAFT PR.
          gh api graphql \
            -H "GraphQL-Features: issues_copilot_assignment_api_support,coding_agent_model_selection" \
            -f query='mutation($a:ID!,$b:ID!){replaceActorsForAssignable(input:{assignableId:$a,actorIds:[$b]}){assignable{... on Issue{number}}}}' \
            -F a="$ISSUE_ID" -F b="$BOT_ID"
