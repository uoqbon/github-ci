# =============================================================================
# Golden-Path Reusable CI  —  acme/.github-governance
# -----------------------------------------------------------------------------
# Consumers call this in ~6 lines (see caller-example.yml):
#   uses: acme/.github-governance/.github/workflows/reusable-ci.yml@<40-char-SHA>
#
# SHA-PINNING NOTE: third-party actions are shown pinned to a *placeholder*
# 40-char SHA with the intended version in a trailing comment. Replace each with
# the real release SHA before use. The enterprise Actions policy REQUIRES full
# SHA pins, so tag/branch refs (e.g. @v4) will FAIL at evaluation.
# =============================================================================
name: reusable-ci

on:
  workflow_call:
    inputs:
      language:
        description: "Build toolchain: node | python | go"
        type: string
        required: true
      runner:
        description: "Runner label. Allow-listed; defaults to the cheap 2-core Linux tier ($0.006/min)."
        type: string
        default: "ubuntu-latest"
      working-directory:
        type: string
        default: "."
    secrets:
      CODECOV_TOKEN:
        required: false

# Least privilege at the top of the file; individual jobs opt UP explicitly.
permissions:
  contents: read

# Cancel superseded runs on the same ref so we stop paying for stale builds.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 0. Cost guard — enforce the runner allow-list.
  #    workflow_call inputs cannot use `choice`, so we validate at runtime and
  #    fail fast if a team requests an expensive large/macOS runner.
  # ---------------------------------------------------------------------------
  guard-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate runner is on the cost allow-list
        env:
          REQUESTED: ${{ inputs.runner }}
        run: |
          ALLOWED="ubuntu-latest ubuntu-24.04 ubuntu-22.04"
          if ! grep -qw "$REQUESTED" <<< "$ALLOWED"; then
            echo "::error::Runner '$REQUESTED' is not allow-listed. Allowed: $ALLOWED"
            echo "Large/macOS runners require a platform-team exception (cost control)."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 1. Mandatory compliance — nested reusable workflow (depth 2 of 10 allowed).
  #    OIDC verification + linters + SHA-pin audit + policy gate + provenance.
  #    Local `./` ref resolves within THIS (governance) repo at the pinned SHA.
  # ---------------------------------------------------------------------------
  compliance:
    needs: guard-runner
    permissions:
      contents: read
      id-token: write          # OIDC verification
      security-events: write   # SARIF upload
      attestations: write      # build provenance
    uses: ./.github/workflows/reusable-security-compliance.yml
    secrets: inherit

  # ---------------------------------------------------------------------------
  # 2. Build & test — gated behind compliance.
  # ---------------------------------------------------------------------------
  build-test:
    needs: [guard-runner, compliance]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@0a1b2c3d4e5f60718293a4b5c6d7e8f901234567 # v4.2.2

      - name: Cache toolchain deps
        uses: actions/cache@1a2b3c4d5e6f70819293a4b5c6d7e8f9012345678 # v4.2.0
        with:
          path: |
            ~/.npm
            ~/.cache/pip
            ~/go/pkg/mod
          key: ${{ runner.os }}-${{ inputs.language }}-${{ hashFiles('**/*lock*') }}

      - name: Build & test
        run: |
          echo "Running ${{ inputs.language }} build + test..."
          # Language-specific invocation goes here (e.g. `make ci`, `npm test`, `go test ./...`).
